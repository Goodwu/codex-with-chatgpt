name: Multi-root validation
on:
  push:
    branches: [feat/secure-multi-root]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: |
          corepack pnpm typecheck
          corepack pnpm build
      - name: Test
        run: corepack pnpm test
      - name: Package reproducible validation fixture
        if: always()
        run: |
          mkdir -p /tmp/c2c-validation
          git archive --format=tar HEAD > /tmp/c2c-validation/source.tar
          if [ -d node_modules ]; then
            tar -czf /tmp/c2c-validation/dependencies.tgz node_modules
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-fixture
          path: /tmp/c2c-validation/
          retention-days: 1
