name: Multi-root validation
on:
  push:
    branches: [feat/secure-multi-root]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: |
          corepack pnpm typecheck
          corepack pnpm build
      - name: Test
        run: corepack pnpm test --maxWorkers=2
